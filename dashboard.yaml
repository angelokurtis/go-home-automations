title: Luzes e Botões
views:
  - title: Luzes e Botões
    path: luzes-botoes
    icon: mdi:lightbulb
    cards:
      - type: custom:auto-entities
        card:
          type: entities
          title: 💡 Luzes (A-Z)
        filter:
          include:
            - domain: light
          exclude:
            - entity_id: light.arandela_da_casa_de_maquina
            - entity_id: light.arandela_da_copa
            - entity_id: light.arandela_da_sala
            - entity_id: light.arandelas_da_piscina
            - entity_id: light.chao_do_jardim
            - entity_id: light.numero_da_casa
            - entity_id: light.spot_da_copa1
            - entity_id: light.spot_da_copa2
        sort:
          method: friendly_name
          numeric: false
      - type: custom:auto-entities
        card:
          type: entities
          title: 🎛️ Botões (A-Z)
        filter:
          include:
            - domain: input_button
        sort:
          method: friendly_name
          numeric: false
